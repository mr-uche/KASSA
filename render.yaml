# Kassa NestJS API — Render Blueprint.
# Existing Supabase PostgreSQL database is reused; no Render database is created.
services:
  - type: web
    name: kassa-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        sync: false # Paste your Supabase Postgres connection string in the Render setup UI.
      - key: JWT_SECRET
        generateValue: true # Render generates a unique 256-bit secret; don't commit it.

# FRONTEND_URL can be added later in the Render Environment panel once the
# Next.js frontend has an HTTPS deployment URL.
# Run production database migrations separately using 'prisma migrate deploy'
# against the intended database when schema changes require them. Do not run
# 'prisma migrate dev' in a live deployment.
