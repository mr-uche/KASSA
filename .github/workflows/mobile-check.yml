name: KASSA Mobile Build Check
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript validation
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Bundle Android
        run: npx expo export --platform android --output-dir dist
      - name: Fail if TypeScript validation failed
        if: ${{ steps.typecheck.outcome == 'failure' }}
        run: exit 1
